<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cf0"/>
      <stop offset="1" stop-color="#4a3aa7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>

  <!-- Code brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="72,84 40,128 72,172"/>
    <polyline points="184,84 216,128 184,172"/>
  </g>

  <!-- Rising bars -->
  <rect x="88"  y="138" width="20" height="44" rx="6" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="118" y="112" width="20" height="70" rx="6" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="148" y="78"  width="20" height="104" rx="6" fill="#1baf7a"/>
</svg>
